[pytest]
# Only our tests. The vendored agentdojo/ and progent/ trees ship their own
# suites with their own dependencies (and are not ours to fix - VENDOR.md), so
# a bare `pytest` must not try to collect them.
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: full four-suite sweeps; correct but slower than the single-suite equivalents
